site_name: UWB Handbook — IEEE 802.15.4z/ab · FiRa · Digital Key
site_description: 임펄스 라디오의 원리부터 802.15.4z 보안 측거, FiRa·CCC 생태계, 802.15.4ab 차세대 UWB까지 — 초급부터 전문가까지 단계적으로 읽는 한글 UWB 핸드북
site_author: UWB Handbook
site_url: https://goodhosup.github.io/uwb/
repo_url: https://github.com/goodhosup/uwb
repo_name: uwb
edit_uri: edit/main/docs/
copyright: 본문과 그림은 직접 작성했습니다. IEEE 802.15.4 절(Clause)과 FiRa·CCC 규격 이름은 출처 표기로만 인용합니다.

theme:
  name: material
  language: ko
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  icon:
    logo: material/radar
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - path: javascripts/diagrams.mjs
    type: module

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        # Material 기본 Mermaid 통합 대신 javascripts/diagrams.mjs가 렌더링 (큰 시퀀스 다이어그램 가독성)
        - name: mermaid
          class: diagram-src
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

validation:
  anchors: warn

watch:
  - includes

nav:
  - 홈: index.md
  - 시작하기:
      - getting-started/index.md
      - UWB란 무엇인가: getting-started/what-is-uwb.md
      - UWB의 역사: getting-started/history.md
      - 표준 지형도 (IEEE·FiRa·CCC): getting-started/landscape.md
      - 표준 문서 읽는 법: getting-started/reading-standards.md
      - 학습 로드맵: getting-started/roadmap.md
  - 공통 기초:
      - basics/index.md
      - 임펄스 라디오와 펄스: basics/impulse-radio.md
      - 대역폭과 시간 분해능: basics/bandwidth-resolution.md
      - UWB 채널과 다중 경로: basics/channel-multipath.md
      - 전파 지연과 LoS/NLoS: basics/los-nlos.md
      - 확산 스펙트럼과 상관: basics/spreading-correlation.md
      - 링크 버짓: basics/link-budget.md
      - 주파수 규제: basics/regulation.md
      - 안테나와 그룹 지연: basics/antenna-delay.md
  - PHY:
      - phy/index.md
      - UWB PHY 개요 (HRP·LRP): phy/overview.md
      - 채널 번호와 대역: phy/channels.md
      - HRP 프레임 구조: phy/hrp-frame.md
      - 프리앰블 코드: phy/preamble-codes.md
      - 변조와 부호화: phy/modulation-coding.md
      - BPRF와 HPRF: phy/bprf-hprf.md
      - STS (Scrambled Timestamp Sequence): phy/sts.md
      - LRP PHY: phy/lrp.md
      - 수신기 구조와 첫 경로 검출: phy/receiver.md
      - PHY 파라미터 표: phy/parameters.md
  - MAC:
      - mac/index.md
      - 802.15.4 MAC 개요: mac/overview.md
      - MAC 프레임과 IE: mac/frame-ie.md
      - 채널 접근: mac/channel-access.md
      - 측거 라운드 구조: mac/ranging-rounds.md
      - 다중 노드 측거: mac/multi-node.md
      - 저전력 동작: mac/low-power.md
  - 측거와 측위:
      - ranging/index.md
      - ToF 측거 원리: ranging/tof.md
      - SS-TWR: ranging/ss-twr.md
      - DS-TWR: ranging/ds-twr.md
      - TDoA (UL·DL): ranging/tdoa.md
      - AoA와 PDoA: ranging/aoa-pdoa.md
      - 위치 추정 알고리즘: ranging/positioning.md
      - 오차 요인과 보정: ranging/errors-calibration.md
      - 성능 지표: ranging/metrics.md
  - 보안:
      - security/index.md
      - 왜 보안 측거인가: security/why-secure-ranging.md
      - STS와 보안 측거: security/sts-secure-ranging.md
      - FiRa 보안 구조: security/fira-security.md
      - 공격 연구와 대응: security/attacks.md
      - 프라이버시: security/privacy.md
  - 생태계:
      - ecosystem/index.md
      - FiRa Consortium: ecosystem/fira.md
      - UCI (UWB Command Interface): ecosystem/uci.md
      - CCC Digital Key 3.0: ecosystem/ccc-digital-key.md
      - CSA Aliro: ecosystem/aliro.md
      - omlox와 RTLS: ecosystem/omlox.md
      - 스마트폰 API (Android·iOS): ecosystem/smartphone-api.md
      - 칩셋 지형: ecosystem/chipsets.md
  - 응용:
      - apps/index.md
      - 디지털 키와 핸즈프리 출입: apps/digital-key.md
      - 실내 측위와 내비게이션: apps/indoor-navigation.md
      - 산업 RTLS: apps/industrial-rtls.md
      - 근접 공유와 분실물 찾기: apps/proximity-tags.md
      - UWB 레이더와 센싱: apps/radar-sensing.md
  - 차세대 UWB:
      - next/index.md
      - 802.15.4ab 개요: next/4ab-overview.md
      - NBA-MMS (협대역 보조): next/nba-mms.md
      - MMS 측거: next/mms-ranging.md
      - 센싱과 레이더 표준화: next/sensing.md
      - 고속 데이터와 저전력: next/data-power.md
      - 다른 기술과의 공존: next/coexistence.md
  - 레퍼런스:
      - reference/index.md
      - UWB vs BLE CS vs Wi-Fi RTT vs 5G: reference/positioning-comparison.md
      - 802.15.4 개정판 인덱스: reference/amendment-index.md
      - 채널·PHY 파라미터 표: reference/parameter-table.md
      - 약어 사전: reference/glossary.md
      - 계산기: reference/calculators.md
      - 참고 자료: reference/resources.md
